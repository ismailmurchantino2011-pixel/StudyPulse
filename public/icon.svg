<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle with safe zone padding -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center emblem within 80% safe zone (x: 51 to 461) -->
  <g transform="translate(60, 60)" filter="url(#glow)">
    <!-- Book open base -->
    <path d="M40 290 Q196 260 196 150 Q196 260 352 290 L352 320 Q196 290 196 180 Q196 290 40 320 Z" fill="#312e81" opacity="0.6"/>
    
    <!-- Pulse rhythm wave through the book -->
    <path d="M30 200 L95 200 L125 130 L165 270 L210 100 L250 250 L280 180 L310 215 L362 200" 
          fill="none" 
          stroke="url(#pulse-grad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Sparkles and brain synapses -->
    <circle cx="210" cy="100" r="14" fill="#38bdf8" />
    <circle cx="165" cy="270" r="10" fill="#a855f7" />
    <circle cx="250" cy="250" r="10" fill="#818cf8" />
    
    <!-- Top Sparkle -->
    <path d="M196 30 Q196 55 220 55 Q196 55 196 80 Q196 55 172 55 Q196 55 196 30 Z" fill="#38bdf8" />
  </g>
</svg>
